<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline'; connect-src 'self' wss: https:; img-src 'self' data:;" />
  <title>ClipVault</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <div class="top-bar">
      <span class="top-bar-title">ClipVault</span>
      <div class="top-bar-search">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l4 4"/></svg>
        <input type="text" id="searchInput" placeholder="type to search..." spellcheck="false" autofocus />
      </div>
    </div>

    <div class="clip-list" id="clipList" tabindex="0">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M12 8v8"/></svg>
        <h3>Clipboard is empty</h3>
        <p>Copy something to get started</p>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="bottom-bar-btn" id="clearBtn">Clear</button>
      <button class="bottom-bar-btn" id="prefsBtn">Preferences</button>
      <button class="bottom-bar-btn" id="aboutBtn">About</button>
      <button class="bottom-bar-btn" id="quitBtn">Quit</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <span>Preferences</span>
      <button type="button" id="panelClose">✕</button>
    </div>
    <div class="settings-body">
      <label class="setting-row">
        <span>Theme</span>
        <select id="themeSelect">
          <option value="system">System</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
      <label class="setting-row">
        <span>Max items</span>
        <input type="number" id="maxItemsInput" min="50" max="5000" step="50" />
      </label>
      <label class="setting-row">
        <span>Global shortcut</span>
        <input type="text" id="shortcutInput" placeholder="Meta+Shift+V" spellcheck="false" />
      </label>
      <button type="button" class="btn" id="exportBtn">Export JSON</button>
      <button type="button" class="btn" id="importBtn">Import JSON</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
